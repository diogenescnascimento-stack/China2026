<style>
:root{
  --bg:#F1F6F5; --surface:#FFFFFF; --surface2:#E8F0F1; --ink:#12313A; --muted:#566F7A; --line:#D3E0E2;
  --head:#0F4C5C; --brand:#0F4C5C; --amber:#E8A317; --amber-ink:#4A3200; --jade:#2E8B6A; --alert:#C8452F; --alert-bg:#FBE6E1;
  --c-voo:#2F6FB0; --c-trem:#3C8D5A; --c-hotel:#7A5BA6; --c-feira:#0F7F8C; --c-fabrica:#D9742C; --c-reuniao:#D9742C; --c-pend:#B8921A; --c-rotina:#8497A0; --c-viagem:#8497A0; --c-descanso:#8497A0;
  --shadow:0 1px 2px rgba(15,76,92,.08),0 6px 18px rgba(15,76,92,.06);
  --fh:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif; --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A2A32; --surface:#103842; --surface2:#16444F; --ink:#E6F1F2; --muted:#9DB6BC; --line:#1F4D59;
    --head:#0D3A45; --brand:#5CBFD1; --amber:#F0B33A; --amber-ink:#2B1D00; --jade:#4CC39B; --alert:#F08A75; --alert-bg:#4A2A27;
    --shadow:0 1px 2px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0A2A32; --surface:#103842; --surface2:#16444F; --ink:#E6F1F2; --muted:#9DB6BC; --line:#1F4D59;
  --head:#0D3A45; --brand:#5CBFD1; --amber:#F0B33A; --amber-ink:#2B1D00; --jade:#4CC39B; --alert:#F08A75; --alert-bg:#4A2A27;
  --shadow:0 1px 2px rgba(0,0,0,.25);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb),system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.zh{font-family:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);color:#fff;padding:10px 14px 8px}
.top-in{max-width:760px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hl{min-width:0}
.logo-row{display:flex;justify-content:center;overflow:hidden;max-height:230px;margin:22px 0 14px;opacity:1}
.applogo{width:168px;height:168px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.namerow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.namerow h1{margin:0!important}
.minilogo{width:0;height:30px;opacity:0;border-radius:50%;transition:width .2s,opacity .2s}
.top.compact .logo-row{max-height:0;opacity:0;margin:0}
.top.compact .minilogo{width:30px;opacity:1}
@media (prefers-reduced-motion:no-preference){.logo-row{transition:max-height .25s ease,opacity .2s ease,margin .25s ease}}
.splash{position:fixed;inset:0;z-index:90;background:#0F4C5C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
.splash img{width:180px;height:180px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.4))}
.splash b{font:700 26px/1 var(--fh);letter-spacing:.06em}
.splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.splash{transition:opacity .45s ease}.splash img{animation:splin .7s ease both}@keyframes splin{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}}
.hl h1{font:700 20px/1.1 var(--fh);margin:0;white-space:nowrap;letter-spacing:.02em}
.hsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#9bb;display:inline-block}
.dot.ok{background:#5fd6a5}.dot.err{background:#ff9a85}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:4px 9px;font-size:12px}
.hclk{flex:0 0 auto;display:grid;gap:5px;background:rgba(255,255,255,.12);border-radius:14px;padding:6px 9px}
.hc{display:grid;grid-template-columns:26px auto auto;align-items:center;column-gap:6px}
.hc svg{width:26px;height:18px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.hc b{font:600 18px/1 var(--fh);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hc b i{font-style:normal;font-size:12px;font-weight:500;opacity:.75;margin-left:2px}
.hc .hd{font-size:11px;opacity:.85;text-align:right;white-space:nowrap;min-width:34px}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 96px}
section[id^="v-"]>*+*{margin-top:12px}
h2{font:600 17px/1.25 var(--fh);margin:18px 0 8px}
h3{font:600 15px/1.3 var(--fb);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.hero{background:var(--head);color:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.hero .ph{font-size:13px;opacity:.85}
.hero .big{font:700 30px/1.1 var(--fh);margin:4px 0 6px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:14px;opacity:.92}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:99px}
.now-card{border-left:6px solid var(--amber)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--surface2);color:var(--muted)}
.pill.now{background:var(--amber);color:var(--amber-ink)}
.pill.late{background:var(--alert-bg);color:var(--alert)}
.pill.ok{background:rgba(46,139,106,.15);color:var(--jade)}

.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.qbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-weight:600;box-shadow:var(--shadow)}
.qbtn small{display:block;font-weight:400;color:var(--muted);margin-top:2px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.dchip{flex:0 0 auto;min-width:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;text-align:center;line-height:1.2}
.dchip b{display:block;font:600 16px/1.2 var(--fh)}
.dchip span{font-size:11.5px;color:var(--muted)}
.dchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.dchip[aria-pressed="true"] b,.dchip[aria-pressed="true"] span{color:var(--bg)}
.dchip.has::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin:3px auto 0}
.dchip.today{outline:2px solid var(--amber)}

.ev{display:grid;grid-template-columns:34px 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cc,var(--line));border-radius:12px;padding:10px 10px 10px 8px;box-shadow:var(--shadow)}
.ev+.ev{margin-top:8px}
.ev.live{border-color:var(--amber);border-left-color:var(--amber);box-shadow:0 0 0 2px rgba(232,163,23,.35)}
.ev.done .evh{text-decoration:line-through;color:var(--muted)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--jade)}
.chk svg{width:16px;height:16px}
.chk.on{border-color:var(--jade);background:rgba(46,139,106,.14)}
.evb{min-width:0;cursor:pointer}
.evt{font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.evt b{font-variant-numeric:tabular-nums}
.zone{color:var(--muted);font-size:12.5px}
.evh{font-weight:600}
.evp{font-size:13px;color:var(--muted)}
.evd{font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evh2{font-size:12.5px;color:var(--jade);margin-top:2px}
.cat{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cc)}

.task{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.task+.task{margin-top:8px}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600}

.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--brand);color:var(--bg)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.warn{background:var(--alert-bg);color:var(--alert)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.amb{background:var(--amber);color:var(--amber-ink)}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:12px 18px}

label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
label.f>span{display:block;margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;color:var(--ink);font-size:15px}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0 0 12px}
legend{font:600 14px var(--fh);padding:0 6px}
.score-row{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center}
.score-row input[type=range]{width:100%;accent-color:var(--brand)}
.score-row b{font-variant-numeric:tabular-nums;text-align:right}

.badge{min-width:54px;text-align:center;border-radius:12px;padding:6px 8px;background:var(--surface2);font:700 20px/1 var(--fh);font-variant-numeric:tabular-nums}
.badge small{display:block;font:500 10.5px var(--fb);color:var(--muted);margin-top:3px}
.badge.hi{background:rgba(46,139,106,.18);color:var(--jade)}
.badge.lo{background:var(--alert-bg);color:var(--alert)}
.ficha{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.ficha+.ficha{margin-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.phr{display:grid;gap:6px}
.phr+.phr{margin-top:8px}
.phr .en{font-weight:600;font-size:16px}
.phr .pr{color:var(--brand);font-size:14.5px}
.phr .pt{color:var(--muted);font-size:13px}
.zhcard .zh-big{font-size:26px;font-weight:700;line-height:1.3}
.zhcard .py{color:var(--brand)}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{background:none;border:0;padding:8px 1px 7px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--brand);font-weight:700}

.ov{position:fixed;inset:0;z-index:60;background:rgba(10,30,36,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.show{position:fixed;inset:0;z-index:70;background:var(--head);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.show .a{font-size:min(11vw,64px);font-weight:700;line-height:1.25}
.show .b{font-size:min(6vw,30px);margin-top:10px;opacity:.95}
.show .c{font-size:15px;margin-top:14px;opacity:.85}
.show .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px}
.show.qr{background:#fff;color:#12313A}.show.qr img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:12px}
.qrthumb{width:170px;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:10px}
.mth{position:relative;margin:0;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.mth img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.mth .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(10,30,36,.75);color:#fff;font-size:15px;line-height:26px;padding:0}
.mth .loc{position:absolute;left:4px;bottom:4px;font-size:10.5px;background:rgba(10,30,36,.75);color:#fff;border-radius:6px;padding:1px 5px}
.mvid{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0A2A32;margin-bottom:8px}
.mvid video{width:100%;max-height:260px;display:block}
.busy{font-size:13px;color:var(--brand);font-weight:600}
.mview{position:fixed;inset:0;z-index:75;background:rgba(10,30,36,.94);display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px))}
.mview img,.mview video{max-width:100%;max-height:100%;border-radius:8px}
.mview .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px}
.micbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.micbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:10px 16px;font-weight:700;background:var(--brand);color:var(--bg)}
.micbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.micbtn[aria-pressed="true"]{background:var(--alert);color:#fff}
@media (prefers-reduced-motion:no-preference){.micbtn[aria-pressed="true"] svg{animation:micp 1.2s ease-in-out infinite}@keyframes micp{50%{transform:scale(1.18)}}}
.micopts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:4px 0 8px}
.micopts label{display:inline-flex;gap:6px;align-items:center}
.miclive{min-height:1.4em;margin:0 0 8px;font-size:14px;color:var(--brand);font-style:italic}
.auds{display:grid;gap:8px;margin-top:10px}
.aud{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.aud audio{width:100%}
.vbox{border:1px solid var(--amber);border-radius:12px;padding:12px;background:rgba(232,163,23,.07);margin:0 0 12px}
.vbox h3{margin:0 0 4px}
.vlive{font-size:13.5px;max-height:120px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.vstat{font-size:13px;font-weight:600;color:var(--brand);margin-top:6px;min-height:1.2em}
.aifill{outline:2px solid var(--amber);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:99px;font-size:13.5px;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .6s ease}}
@media (min-width:640px){.quick{grid-template-columns:repeat(4,1fr)}}
</style>

"], ["Suporte e peças", 10, "Garantia, peças, atendimento remoto"], ["Clareza e confiança", 5, "Respondem rápido? É fábrica ou trading?"]], "phrases": [{"n": "Resgate", "i": [["Sorry, my English is not good. Please speak slowly.", "sóri, mai ínglish iz nót gúd. plíiz spíik slôuli", "Abertura de qualquer conversa difícil"], ["Can you write it down, please?", "kén iu ráit it dáun, plíiz?", "Número, preço, prazo, nome"], ["Can you type it on my phone?", "kén iu táip it on mai fôun?", "Quando falam rápido"], ["Can you say it again, please?", "kén iu sêi it eguén, plíiz?", "Perdeu uma frase"], ["Do you mean ...?", "du iu míin ...?", "Para checar o que você entendeu"], ["Let me repeat.", "lét mi ripít", "Antes de fechar um ponto"], ["One moment, please. I use my translator.", "uân mômento, plíiz. ai iúz mai trénslêiter", "Hora de abrir o WeChat ou o app"], ["Is this price per piece?", "iz dis práis pér píis?", "Todo preço que aparecer"], ["Please show me on the calculator.", "plíiz chôu mi on di kélquiuleiter", "Preço, desconto, quantidade"], ["Do you have WeChat? Please send it to me by WeChat.", "du iu rév uítchét? plíiz sénd it tu mi bai uítchét", "Fim da conversa"]]}, {"n": "Aeroporto", "i": [["Business. I go to a trade fair in Guangzhou.", "bíznes. ai gôu tu a trêid fér in Guan-jôu", "Motivo da viagem"], ["I stay in Hong Kong only a few hours. I take the train to China today.", "ai stêi in Rong Kong ôunli a fiú auers. ai têik di trêin tu Chaina tudêi", "Quanto tempo em HK"], ["Where is the Airport Express to Kowloon?", "uér iz di érport ekspréss tu Cau-lún?", "Trem do aeroporto"], ["How do I go to West Kowloon high speed train station?", "rau du ai gôu tu Uést Cau-lún rái-spíid trêin stêishon?", "Baldeação"], ["I have a ticket to Guangzhou South.", "ai rév a tíket tu Guan-jôu Sáuth", "Na estação de West Kowloon"], ["Business visit. Canton Fair. Thirteen days.", "bíznes vízit. Cén-ton Fér. thârtín dêis", "Imigração da China"], ["I filled the online arrival card. Here ], ["Receipt, please.", "risít, plíiz", "Nota"]]}, {"n": "Estande", "i": [["Hello! Nice to meet you.", "rélou! náis tu mít iu", "Cumprimento"], ["I am Diogenes, from Hald do Brasil. We import tools and abrasives for construction companies in Brazil.", "ai ém Diôgenes, fróm Rald dô Brasíl. uí ímport túls énd abreisivs fór conestrâcshon cômpanis in Brasíl", "Quem é você"], ["I am looking for floor grinding robots.", "ai ém lúquin fór flór grainding rôubots", "Troque pelo produto"], ["May I ask a few questions, please?", "mêi ai ásk a fiú cuéschons, plíiz?", "Permissão"], ["Here is my card. May I have yours?", "rír iz mai card. mêi ai rév iórs?", "Cartões"], ["Are you the factory or a trading company?", "ar iu di fáctori ór a trêidin cômpani?", "Em todo estande"], ["May I take a picture of the product and the price sheet?", "mêi ai têik a píctur óv di próduct énd di práis chiit?", "Foto"], ["Do you have a catalog? Can you send it by WeChat?", "du iu rév a cátalog? kén iu sénd it bai Uítchét?", "Catálogo"], ["Who is the sales manager for Latin America?", "rú iz di sêils ménajer fór Látin América?", "Quem decide"], ["Thank you very much. I will contact you later.", "thénk iu vérri mâtch. ai uíl cóntact iu lêiter", "Saída educada"]]}, {"n": "Ficha", "i": [["What is the model number and the size?", "uót iz di módel nâmber énd di sáiz?", "Produto"], ["What is the price in US dollars, per piece?", "uót iz di práis in iú-és dólars, pér píis?", "Preço USD"], ["Is this price FOB?", "iz dis práis éf-ôu-bí?", "FOB?"], ["What is the minimum order quantity?", "uót iz di mínimum órder cuántiti?", "MOQ"], ["What is the HS code for this product?", "uót iz di êitch-és côud fór dis próduct?", "NCM / HS"], ["In which city is your factory?", "in uítch síti iz iór fáctori?", "Cidade da fábrica"], ["How many pieces in a 40-foot container? And in a 20-foot?", "rau méni píises in a fórti-fut contêiner? énd in a tuénti-fut?", "Peças por contêiner"], ["Which port do you ship from?", "uítch pórt
